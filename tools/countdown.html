<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>นับถอยหลัง · UniTools</title><script src="../assets/common.js"></script><link rel="stylesheet" href="../assets/style.css"><script src="js/countdown.js" defer></script></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5-9-5Zm4 3v6c3 3 7 3 10 0v-6m4-3v9"/></svg></span>UniTools<span class="brand-dot">.</span></a><a href="../index.html" class="back btn primary">← <span>ทุกเครื่องมือ</span></a><button type="button" class="theme-toggle" aria-label="เปลี่ยนธีมสี" title="เปลี่ยนธีมสี"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button></div></header><main class="container tool-page events"><div class="page-heading"><span class="icon-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4M12 2v3"/></svg></span><div><p class="eyebrow">งานเลี้ยง & อีเวนต์</p><h1>นับถอยหลัง</h1><p class="muted">นับถอยหลังเต็มจอสู่ปีใหม่หรืองานสำคัญ พร้อมพลุและเสียงตอนถึงเวลา</p></div></div>

<section id="countdown-setup" class="card"><h2>ตั้งเวลาช่วงพิเศษ</h2><label>เป้าหมาย<select id="target-mode"><option value="newyear">1 มกราคมถัดไป เวลา 00:00</option><option value="custom">วันและเวลาที่กำหนด</option><option value="minutes">อีก N นาที</option></select></label><label id="custom-field" hidden>วันและเวลา<input id="target-date" type="datetime-local"></label><label id="minutes-field" hidden>อีกกี่นาที<input id="minutes" type="number" min="0.01" max="525600" step="any" value="5"></label><label>หัวข้อ<input id="title" maxlength="200"></label><label>ข้อความเมื่อถึงเวลา<input id="end-message" maxlength="200"></label><div class="row"><button id="start" class="btn primary">เริ่มนับถอยหลัง</button><button id="rehearse" class="btn">ทดลองนับ 10 วินาที</button><button id="test-fireworks" class="btn">ทดสอบพลุ</button></div></section>
<section id="countdown-stage" class="card countdown-stage"><canvas id="fireworks" aria-hidden="true"></canvas><div class="countdown-content"><h2 id="stage-title"></h2><div id="time-blocks" class="time-blocks" role="timer"></div><div id="giant-number" class="giant-number" hidden></div><h2 id="celebration" hidden></h2><div class="row stage-controls"><button id="fullscreen" class="btn">เต็มจอ / โปรเจกเตอร์</button><button id="mute" class="btn" aria-pressed="false">เสียง: เปิด</button><button id="stop" class="btn">กลับไปตั้งค่า</button></div><p class="note">ตรวจเวลาเครื่องให้ตรงก่อนงาน · <span id="device-clock"></span></p></div></section><p id="event-status" role="status" aria-live="polite"></p></main></body></html>
