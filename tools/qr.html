<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สร้าง QR Code · UniTools</title><script src="../assets/common.js"></script><link rel="stylesheet" href="../assets/style.css"><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script><script src="js/qr.js" defer></script></head><body><header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 8 9-5 9 5-9 5-9-5Zm4 3v6c3 3 7 3 10 0v-6m4-3v9"/></svg></span>UniTools<span class="brand-dot">.</span></a><a href="../index.html" class="back btn primary">← <span>ทุกเครื่องมือ</span></a><button type="button" class="theme-toggle" aria-label="เปลี่ยนธีมสี" title="เปลี่ยนธีมสี"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button></div></header><main class="container tool-page sky"><div class="page-heading"><span class="icon-tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><path d="M15 15h3v3h3v3h-6v-3m6-6v3M3 12h6m3-9v6m0 6v6"/></svg></span><div><p class="eyebrow">ลิงก์ & QR</p><h1>สร้าง QR Code</h1><p class="muted">ข้อความ Wi-Fi และพร้อมเพย์</p></div></div><section class="card"><div class="tabs" role="tablist" aria-label="ประเภท QR"><button class="tab active" data-tab="text" role="tab" aria-selected="true">ข้อความ/ลิงก์</button><button class="tab" data-tab="wifi" role="tab" aria-selected="false">Wi-Fi</button><button class="tab" data-tab="pay" role="tab" aria-selected="false">PromptPay</button></div><div class="grid-2"><div><div data-panel="text"><label for="text">ข้อความหรือลิงก์</label><textarea id="text" placeholder="https://example.ac.th"></textarea></div><div data-panel="wifi" hidden><label for="ssid">ชื่อเครือข่าย (SSID)</label><input id="ssid"><label for="password">รหัสผ่าน Wi-Fi</label><input id="password" type="password"><label for="security">ความปลอดภัย</label><select id="security"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">ไม่มีรหัสผ่าน</option></select></div><div data-panel="pay" hidden><label for="pay-id">เบอร์โทรศัพท์ หรือเลขบัตรประชาชน/ภาษี 13 หลัก</label><input id="pay-id" inputmode="numeric" placeholder="0812345678"><label for="amount">จำนวนเงิน (ไม่จำเป็น)</label><input id="amount" type="number" min="0.01" max="9999999999.99" step="0.01"><p class="muted">ตรวจชื่อผู้รับในแอปธนาคารก่อนชำระทุกครั้ง</p></div><details><summary>ตัวเลือก QR</summary><label for="size">ขนาด PNG (พิกเซล)</label><select id="size"><option>256</option><option selected>512</option><option>1024</option></select><label for="level">การแก้ไขข้อผิดพลาด</label><select id="level"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select><div class="row"><label>สีจุด<input id="fg" type="color" value="#143c32"></label><label>สีพื้นหลัง<input id="bg" type="color" value="#ffffff"></label></div><label for="logo">โลโก้ตรงกลาง (ไม่จำเป็น)</label><input type="file" id="logo" accept="image/png,image/jpeg,image/webp"><button class="btn ghost" id="remove-logo" type="button">ลบโลโก้</button><p class="muted">ภาพไม่ถูกอัปโหลด ใช้ระดับ H อัตโนมัติเมื่อมีโลโก้ ควรทดสอบสแกนก่อนใช้จริง และใช้สีที่ตัดกันชัดเจน</p></details><p><button class="btn primary" id="generate">สร้าง QR Code</button></p><p id="qr-status" role="status"></p></div><div><div id="qr-preview"><p class="muted">QR ของคุณจะแสดงที่นี่</p></div><div class="row"><button class="btn" id="png" disabled>ดาวน์โหลด PNG</button><button class="btn" id="svg" disabled>ดาวน์โหลด SVG</button></div><details><summary>ข้อมูลที่เข้ารหัส</summary><output id="payload" class="result"></output></details></div></div></section></main></body></html>
